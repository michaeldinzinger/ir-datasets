_:
  pretty_name: 'WebFAQ'
  desc: '
<p>
WebFAQ is a multilingual retrieval benchmark built from natural question-answer pairs extracted
from FAQ pages on the web. Questions are queries and answers are documents. The source retrieval
collection provides official train and test splits; it does not provide a validation split.
</p>
<p>
This ir_datasets integration provides the 20 languages for which WebFAQ Hard Negatives are available:
Arabic (<code>ara</code>), Danish (<code>dan</code>), German (<code>deu</code>), English (<code>eng</code>),
Persian (<code>fas</code>), French (<code>fra</code>), Hindi (<code>hin</code>), Indonesian (<code>ind</code>),
Italian (<code>ita</code>), Japanese (<code>jpn</code>), Korean (<code>kor</code>), Dutch (<code>nld</code>),
Polish (<code>pol</code>), Portuguese (<code>por</code>), Russian (<code>rus</code>), Spanish (<code>spa</code>),
Swedish (<code>swe</code>), Turkish (<code>tur</code>), Vietnamese (<code>vie</code>) and Chinese (<code>zho</code>).
Corpus answers are deduplicated by exact text while retaining the first source occurrence, and qrels are
remapped to the retained document IDs.
</p>
<p>
Training scoreddocs combine each positive answer with BM25-mined candidates from the WebFAQ Hard
Negatives collection. The supplied scores were produced by BGE-M3 and are intended as teacher
scores for training or knowledge distillation. They are not relevance judgments and no
scoreddocs are available for the test splits.
</p>
<ul>
  <li><a href="https://dl.acm.org/doi/10.1145/3726302.3731934">Dataset paper (SIGIR 2025)</a></li>
  <li><a href="https://dl.acm.org/doi/10.1145/3805712.3808621">Hard-negative dataset paper (SIGIR 2026)</a></li>
  <li><a href="https://huggingface.co/datasets/PaDaS-Lab/webfaq-retrieval">Source retrieval dataset</a></li>
  <li><a href="https://huggingface.co/datasets/IrvinTopi/WebFAQHardNegatives">Source hard-negative dataset</a></li>
  <li><a href="https://huggingface.co/datasets/PaDaS-Lab/webfaq-ir-datasets">ir_datasets-ready JSONL archives</a></li>
  <li>Language identifiers use ISO 639-3 codes.</li>
  <li>License: Creative Commons Attribution 4.0 (CC BY 4.0).</li>
</ul>
<p>
As with the source collection, qrels are sparse: each question has one confirmed answer, although
other corpus documents may also answer it.
</p>
'
  bibtex_ids: ['Dinzinger2025WebFAQ', 'Dinzinger2026WebFAQ2']

ara:
  desc: '
<p>
The Arabic WebFAQ document collection. It contains 141,089 unique answer documents after exact-text
deduplication of the 142,664 source question-answer pairs. Use <a class="ds-ref">webfaq/ara/train</a>
and <a class="ds-ref">webfaq/ara/test</a> for queries and relevance judgments.
</p>
'
  bibtex_ids: ['Dinzinger2025WebFAQ']

ara/train:
  desc: '
<p>
The Arabic WebFAQ training split, containing 132,664 queries and one confirmed relevant answer per query.
It also provides 6,336,393 BGE-M3-scored positive and hard-negative documents derived from 32,000
hard-negative records.
</p>
<p>
The scoreddocs are training signals, not qrels or an evaluation run.
</p>
'
  bibtex_ids: ['Dinzinger2025WebFAQ', 'Dinzinger2026WebFAQ2']

ara/test:
  desc: '
<p>
The Arabic WebFAQ test split, containing 10,000 queries and one confirmed relevant answer per query.
There are no test scoreddocs.
</p>
'
  bibtex_ids: ['Dinzinger2025WebFAQ']

